version: "3.8"

services:
  recommandapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recommandapi
    restart: unless-stopped
    ports:
      - "3001:8000"
    environment:
      - PORT=8000
      - MARIADB_HOST=${MARIADB_HOST:-mariadb}
      - MARIADB_PORT=${MARIADB_PORT:-3306}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-recommand_db}
      - MARIADB_USER=${MARIADB_USER:-recommand_user}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-change-this-secret}
      - JWT_EXPIRE_HOURS=${JWT_EXPIRE_HOURS:-24}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID:-}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET:-}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID:-}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET:-}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - recommand-network

  mariadb:
    image: mariadb:11
    container_name: recommand-mariadb
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${MARIADB_DATABASE:-recommand_db}
      - MYSQL_USER=${MARIADB_USER:-recommand_user}
      - MYSQL_PASSWORD=${MARIADB_PASSWORD:-recommand_pass}
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-rootpass}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recommand-network

volumes:
  mariadb_data:

networks:
  recommand-network:
    driver: bridge
